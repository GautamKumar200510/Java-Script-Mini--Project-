<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="simon.css">
    <script src="simon.js"></script>
</head>
<body>
    <h1>Simon Says Game</h1>
    <h2>Press Any Key to Start the Game</h2>

    <div id="id-container">
        <div class="line one">
        <div class="color-button red" type =" button">1</div>
        <div class="color-button yellow" type="button">2</div>
        </div>
        <div class="line two">
        <div class="color-button green" type="button">3</div>
        <div class="color-button purple" type="button">4</div>
        </div>
    </div>
</body>
</html>
